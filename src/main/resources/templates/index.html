<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css"th:href="@{/styles/2_0_Style.css}"/>
	<link rel="icon" type="image/x-icon" th:href="@{/images/under_construction.svg}">
	<script th:src="@{/scripts/api.js}" defer></script>
	<script th:src="@{/scripts/animations.js}" defer></script>
	<script th:src="@{scripts/data.js}" defer></script>
</head>
<body >
	
	<header> <!--/* Header fragent here */--> 
		<div th:replace="~{fragments/BRC2_header :: BRC2_header}"></div>
	</header>
		
	<main>
		
		
		<div class="text-area-search-bar-layer">
			
			<div class="search-bar-wrapper">
				<a class="search-bar-info">Pretraži</a>
				<input class="bible-area-search-bar" id="bible_search_bar" type="text" placeholder="Najmanje 3 znaka...">
			</div>
			
			<div class="search-bar-options">
				
				
			</div>
			
		</div>

		<div class="reading-area-wrapper">
			
			<div class="reading-area" id="bible_text">
				<!--/* John 1 is the current placeholder */-->
				<p th:each="verse : ${verses}" th:text="|${verse.number}. ${verse.text}|"></p>				
			</div>
			<div th:replace="~{fragments/BRC2_book-scroll}">
				
				<!--/* Book Scroll is populated from the database */-->
			</div>
		</div>
		
		
	</main>
	
	<footer> <!--/* Footer fragment here*/--> 
		<div th:replace="~{fragments/BRC2_footer :: BRC2_footer}"></div>
	</footer>
	
</body>
</html>
