<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div class="user-icon-username-wrapper">
	<div th:fragment="BRC2_user-icon" class="header-cell">
		<div th:if="${currentlyLoggedUser}" class="user-icon-wrapper">
			<img class="user-icon" th:src="@{/images/user-logged.svg}">
			<a th:text="${currentlyLoggedUser.username}"></a>
		</div>
		<div th:unless="${currentlyLoggedUser}">
			<img class="user-icon" th:src="@{/images/user-unlogged.svg}">
			<a th:text="guest"></a>
		</div>
	</div>
</div>
