<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" type="text/css"th:href="@{/styles/2_0_Style.css}"/>	
</head>
<body>
	<div th:fragment="BRC2_header" class="header-wrapper">
		
		<div class="header-upper-layer">
			
			<div class="header-logo-wrapper">
				<img class="header-logo" th:src="@{images/Bibilijaija-logo.png}" alt="Biblija&ja Logo">
			</div>
			
			<div th:if="${currentlyLoggedUser}" class="header-user-icon-wrapper">
				<img class="user-icon" th:src="@{/images/user-logged.svg}">
				<a th:text="${currentlyLoggedUser.username}"></a>
			</div>
			<div th:unless="${currentlyLoggedUser}" class="header-user-icon-wrapper">
				<img class="user-icon" th:src="@{/images/user-unlogged.svg}">
				<a th:text="guest"></a>
			</div>
			
			<div th:replace="~{fragments/BRC-Hamburger-Options :: BRC-Hamburger-Options}">
				
				
			</div>
			
			
		</div>
		
		<div class="header-lower-layer">
			<div class="header-line-separator"></div>						
		</div>
		
	</div>		
</body>	
</html>
