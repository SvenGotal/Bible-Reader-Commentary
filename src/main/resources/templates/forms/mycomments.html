<!--/* mycomments.html
*	My comments is a View where user can view, edit and delete their comments, also they are able to make them publicly visible 
*	or private after their creation.
*
*	Author: Sven Gotal
*	Date of Creation: 2024
*	Date of last update: 18.04.2025
*	Dependency: Thymeleaf, myComments.css, mainStyle.css
*/-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title>BIBLIJA&ja</title>
	<meta charset="UTF-8">
	<meta name="viewport"content="width=device-width, initial-scale=1, shrink-to-fit=yes">
	<link rel="icon" type="image/x-icon" th:href="@{/images/logoico.png}">
	<script th:src="@{/scripts/userspace.js}"></script>
	<script th:src="@{/scripts/javascript.js}"></script>
	<script th:src="@{/scripts/quill_init_script.js}"></script>
	<script th:src="@{/scripts/scrollbutton.js}" defer></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" type="text/css" th:href="@{/styles/2_0_Style.css}"/>

	<!--/*######################################################### Google Fonts #########################################################*/-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
	<!--/*################################################################################################################################################*/-->	
	
	<!-- Quill styles -->
	<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
	<!-- Quill JS -->
	<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
</head>
<body class="user-comments-body">
	<header>
		<div th:replace="~{/fragments/BRC2_header :: BRC2_header}"></div>		
	</header>
	
	<div id="toast_message" class="toast-message toast-message-show"></div>
	<main class="user-comments-main">
		
		<!--/*======================================================= /Header =======================================================*/-->
		<!--/*======================================================= Comments Not Found Area =======================================================*/-->
		<div th:if="${noCommentsFound != null OR serverMessage != null}" class="comments-area myComments-no-comments-found">
			<div>
				<h1 th:text="${message}"></h1>
				<h1 th:text="${noCommentsFound}"></h1>
				<div class="comment-edit-options">
					<div class="options-list">
						<span> 
							<a href="/private/submitComment">Napiši komentar</a>
							<a th:if="${message}" href="/private/myComments">Natrag na moji komentari</a>
						</span>
					</div>
				</div>
			</div>
		</div>
		<!--/*======================================================= Comments Found Area =======================================================*/-->
		<div class="user-comments-main-container" th:unless="${noCommentsFound != null OR serverMessage != null}">
			<div class="user-comments-go-to-top-button-wrapper">
				<input class="brc-button" id="go_to_top_button_upper" onclick="goToTop()" type="button" value="Na vrh">
			</div>
			<div class="user-comments-comments-partition">				

						<div class="user-comments-comment-body" th:each="comment : ${comments}" >
							<div class="user-comments-subject-row">
								<div>
									<label>Datum:</label>
									<div th:id="${'timestamp_' + comment.id}" th:text="${#temporals.format(comment.dateOfCreation, 'dd.MM.yyyy.')}"></div>
								</div>
								<div>
									<label>Naslov:</label>
									<div th:id="${'subject_' + comment.id}" th:text="${comment.subject}"></div>
								</div>
								<div>
									<label>Knjiga : Poglavlje</label>					
									<div th:id="${'book_chapter_' + comment.id}" class="word-break" th:text="${comment.chapter.book.name + ' ' + comment.chapter.number}"></div>
								</div>
								<div>
									<label>Vidljivost:</label>
									<div th:id="${'published_' + comment.id}" th:data-is-published="${comment.published}" th:if="${comment.published}" class="myComments-is-published word-break">Public</div>							
									<div th:id="${'published_' + comment.id}" th:data-is-published="${comment.published}" th:unless="${comment.published}" class="myComments-not-published word-break">Private</div>
								</div>
								<div class="user-comments-open-button-wrapper">
									<button class="brc-button"  th:data-comment-id="${comment.id}" onclick="toggleAccordion(this)">+</button>																
								</div>
							</div>
							<div class="user-comments-comment-row" th:attr="id=${comment.id}">
								<div th:id="${'text_' + comment.id}" th:utext="${comment.text}"></div>											
							</div>
							<div class="user-comments-option-buttons-row" id="myComments_delete_button_row">
								<div class="delete-comment-button-wrapper">
									<form th:action="@{/private/myComments/deleteComment}" method="post" th:id="${'commentDeleteForm_' + comment.id}" >
										<input type="hidden" th:name="commentId" th:value="${comment.id}" id="commentEditingIdHolder"/>
										<button class="brc-button" th:id="${comment.id}" onclick="deleteComment(this)">Delete</button>
									</form>																																
								</div>
								<div class="share-comment-button-wrapper">
									<button class="brc-button" th:data-comment-id="${comment.id}" onclick="shareThisComment(this)">Share</button>
								</div>
								<div class="edit-comment-button-wrapper">
									<button class="brc-button" th:data-comment-id="${comment.id}" onclick="modifyThisComment(this)">Edit</button>
								</div>
							</div>
						</div>


				<!--/*======================================================= Comments Editing Area =======================================================*/-->
				<div  id="user-comment-comment-editing-div" style="display: none;" class="comment-edit-div">
					<div>
						<form method="post" id="formEdit" th:action="@{/private/myCommentsEdit}" th:object="${comment}">
							<div class="comment-subject-and-published-wrapper">
								<table class="myComments-comments-table">
									<tbody >
										<tr class="myComments-subject-row">
											<td><label>Naslov: </label></td>
											<td class="comment-edit-subject-grid"><input th:field="*{subject}" type="text" class="comment-edit-subject-grid" id="comment_subject_content"/></td>
											<td><label>Javni komentar: </label></td>
											<td class="comment-edit-checkbox-grid"><input th:field="*{published}" type="checkbox" id="comment_published_content" /></td>
										</tr>
									</tbody>
								</table>
							</div>
							<div class="quill-editor-wrapper">
								<!-- Hidden input to store the actual HTML to submit -->
								<input type="hidden" name="commentContent" id="commentContent" th:field="*{text}" />
								<input type="hidden" id="comment_id_holder" th:field="*{id}"/>
								<!-- Container for the Quill editor -->
								<div id="quillEditor" style="height: auto;"></div>
							</div>
							<div class="comment-edit-buttons-wrapper">
								<table class="myComments-comments-table">
									<tbody>
										<tr class="myComments-subject-row">
											<td></td>
											<td class="no-background-color"><button class="options-button" type="submit" onclick="submitEditedComment()">Save</button></td>
										</tr>
									</tbody>
								</table>
							</div>
						</form>
						
					</div>
				</div>
			</div>			
		</div>
		<!--/*======================================================= /Comments Area =======================================================*/-->
	</main>
	<!--/*======================================================= /Footer Area =======================================================*/-->
	<footer> <!--/* Footer fragment here*/--> 
		<div th:replace="~{fragments/BRC2_footer :: BRC2_footer}"></div>
	</footer>
</body>
</html>
